version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: todo-app-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=todo_app123$
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
